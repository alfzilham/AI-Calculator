<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Vanilla HTML/CSS/JS calculator with claymorphism + glassmorphism styling over an animated gradient waves (WebGL2) background.">
  <meta name="theme-color" content="#17140f">

  <meta property="og:title" content="Calculator">
  <meta property="og:description" content="Minimalist calculator with an animated gradient waves background.">
  <meta property="og:type" content="website">

  <title>Calculator</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
</head>

<body data-theme="dark">

  <!-- Background layer -->
  <div class="waves-bg" id="wavesBg"></div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Sidebar control dock: the button moves into the sidebar header when open -->
  <div class="sidebar-toggle-dock" id="sidebarToggleDock">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Open sidebar" aria-expanded="false" aria-controls="sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
    </button>
  </div>

  <!-- Sidebar: glassmorphism navigation (desktop: collapsible, mobile: drawer overlay) -->
  <aside class="sidebar" id="sidebar" tabindex="-1" aria-label="Main navigation">
    <div class="sidebar-inner">
      <!-- Brand + search + nav content area -->
      <div class="sidebar-content">
        <!-- Sidebar header: brand + close control dock -->
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <span class="sidebar-brand-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line></svg>
            </span>
            <span class="sidebar-brand-name">AI Calculator</span>
          </div>
          <div class="sidebar-header-toggle-dock" id="sidebarHeaderToggleDock"></div>
        </div>
        <!-- Search -->
        <div class="sidebar-search">
          <svg class="sidebar-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"></circle><line x1="21" x2="16.65" y1="21" y2="16.65"></line></svg>
          <input type="search" class="sidebar-search-input" placeholder="Search" aria-label="Search">
        </div>
        <!-- Navigation -->
        <nav class="sidebar-nav" aria-label="Sidebar navigation">
          <ul class="sidebar-nav-list" role="list">
            <li class="sidebar-nav-item">
              <button class="sidebar-nav-btn active" data-nav="home" aria-current="page">
                <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="sidebar-nav-label">Home</span>
              </button>
            </li>
          </ul>

          <div class="sidebar-nav-divider" role="separator"></div>

          <ul class="sidebar-nav-list" role="list">
            <li class="sidebar-nav-item">
              <button class="sidebar-nav-btn" data-nav="chatbot">
                <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"></path></svg>
                <span class="sidebar-nav-label">AI Chatbot</span>
                <span class="sidebar-nav-badge">Demo</span>
              </button>
            </li>
            <li class="sidebar-nav-item">
              <button class="sidebar-nav-btn" data-nav="projects">
                <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
                <span class="sidebar-nav-label">Projects</span>
                <span class="sidebar-nav-badge">Demo</span>
              </button>
            </li>
            <li class="sidebar-nav-item">
              <button class="sidebar-nav-btn" data-nav="settings">
                <svg class="sidebar-nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span class="sidebar-nav-label">Settings</span>
                <span class="sidebar-nav-badge">Demo</span>
              </button>
            </li>
          </ul>
        </nav>
        <!-- User profile will be added here -->
      </div>
      <!-- User profile (sticky bottom) -->
      <div class="sidebar-footer">
        <div class="sidebar-profile-dropdown" id="profileDropdown">
          <button class="sidebar-profile" id="sidebarProfile" type="button" aria-expanded="false" aria-controls="profileMenu">
            <div class="sidebar-profile-avatar">A</div>
            <div class="sidebar-profile-info">
              <span class="sidebar-profile-name">Alfiz</span>
              <span class="sidebar-profile-plan">Free Plan</span>
            </div>
            <svg class="sidebar-profile-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="sidebar-profile-menu" id="profileMenu" role="menu" aria-label="Profile menu" hidden>
            <button class="sidebar-profile-menu-item" role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <span>Settings</span>
            </button>
            <button class="sidebar-profile-menu-item" role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3v12"></path><path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path><path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
              <span>Upgrade plan</span>
            </button>
            <div class="sidebar-profile-menu-divider" role="separator"></div>
            <button class="sidebar-profile-menu-item" role="menuitem">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>
              <span>Log out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <div class="calculator" id="calculator">

    <div class="calc-top">
      <button class="theme-btn" id="themeToggle" aria-label="Toggle dark and light mode">
        <!-- Sun: ditampilkan saat dark, klik untuk beralih ke light -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <!-- Moon: ditampilkan saat light, klik untuk beralih ke dark -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>

    <div class="calc-display">
      <div class="history" id="history" aria-live="polite">&nbsp;</div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>

    <div class="calc-grid">
      <button class="btn btn-func" data-action="clear-entry">CE</button>
      <button class="btn btn-func" data-action="clear">C</button>
      <button class="btn btn-func" data-action="backspace" aria-label="Delete last digit">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"></path><line x1="18" x2="12" y1="9" y2="15"></line><line x1="12" x2="18" y1="9" y2="15"></line></svg>
      </button>
      <button class="btn btn-op" data-op="÷">÷</button>

      <button class="btn btn-func" data-action="square">×²</button>
      <button class="btn btn-func" data-action="sqrt">√</button>
      <button class="btn btn-func" data-action="percent">%</button>
      <button class="btn btn-op" data-op="×">×</button>

      <button class="btn btn-num" data-num="7">7</button>
      <button class="btn btn-num" data-num="8">8</button>
      <button class="btn btn-num" data-num="9">9</button>
      <button class="btn btn-op" data-op="−">−</button>

      <button class="btn btn-num" data-num="4">4</button>
      <button class="btn btn-num" data-num="5">5</button>
      <button class="btn btn-num" data-num="6">6</button>
      <button class="btn btn-op" data-op="+">+</button>

      <button class="btn btn-num" data-num="1">1</button>
      <button class="btn btn-num" data-num="2">2</button>
      <button class="btn btn-num" data-num="3">3</button>
      <button class="btn btn-op btn-equals" data-action="equals">=</button>

      <button class="btn btn-func" data-action="negate">+/-</button>
      <button class="btn btn-num" data-num="0">0</button>
      <button class="btn btn-num" data-action="decimal">.</button>
    </div>

  </div>

  <!-- PROJECTS_INJECTION_POINT: projects-view will be added here, sibling of .calculator -->
  <!-- Nav integration: sidebar nav buttons with data-nav="projects" will trigger page switching -->
  <!-- JS integration: renderProjectsPage(), openProjectDetail(), openCreateProjectModal() -->

  <script src="assets/js/gradient-waves.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
