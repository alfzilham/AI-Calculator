<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Vanilla HTML/CSS/JS calculator with claymorphism + glassmorphism styling over an animated gradient waves (WebGL2) background.">
  <meta name="theme-color" content="#17140f">

  <meta property="og:title" content="Calculator">
  <meta property="og:description" content="Minimalist calculator with an animated gradient waves background.">
  <meta property="og:type" content="website">

  <title>Calculator</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="shortcut icon" href="assets/favicon/favicon.ico" type="image/x-icon">
</head>

<body data-theme="dark">

  <!-- Background layer -->
  <div class="waves-bg" id="wavesBg"></div>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <!-- Sidebar: glassmorphism navigation (desktop: collapsible, mobile: drawer overlay) -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-inner">
      <!-- Brand + search + nav content area -->
      <div class="sidebar-content">
        <!-- Brand -->
        <div class="sidebar-brand">
          <span class="sidebar-brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="12" y2="14"></line></svg>
          </span>
          <span class="sidebar-brand-name">AI Calculator</span>
        </div>
        <!-- Search, navigation, and profile will be added here -->
      </div>
      <!-- User profile (sticky bottom) -->
      <div class="sidebar-footer">
        <!-- User profile will be added here -->
      </div>
    </div>
  </aside>

  <div class="calculator" id="calculator">

    <div class="calc-top">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open sidebar" aria-expanded="false" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="3" x2="21" y1="6" y2="6"></line><line x1="3" x2="21" y1="12" y2="12"></line><line x1="3" x2="21" y1="18" y2="18"></line></svg>
      </button>
      <button class="theme-btn" id="themeToggle" aria-label="Toggle dark and light mode">
        <!-- Sun: ditampilkan saat dark, klik untuk beralih ke light -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <!-- Moon: ditampilkan saat light, klik untuk beralih ke dark -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>

    <div class="calc-display">
      <div class="history" id="history" aria-live="polite">&nbsp;</div>
      <div class="result" id="result" aria-live="polite">0</div>
    </div>

    <div class="calc-grid">
      <button class="btn btn-func" data-action="clear-entry">CE</button>
      <button class="btn btn-func" data-action="clear">C</button>
      <button class="btn btn-func" data-action="backspace" aria-label="Delete last digit">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"></path><line x1="18" x2="12" y1="9" y2="15"></line><line x1="12" x2="18" y1="9" y2="15"></line></svg>
      </button>
      <button class="btn btn-op" data-op="÷">÷</button>

      <button class="btn btn-func" data-action="square">×²</button>
      <button class="btn btn-func" data-action="sqrt">√</button>
      <button class="btn btn-func" data-action="percent">%</button>
      <button class="btn btn-op" data-op="×">×</button>

      <button class="btn btn-num" data-num="7">7</button>
      <button class="btn btn-num" data-num="8">8</button>
      <button class="btn btn-num" data-num="9">9</button>
      <button class="btn btn-op" data-op="−">−</button>

      <button class="btn btn-num" data-num="4">4</button>
      <button class="btn btn-num" data-num="5">5</button>
      <button class="btn btn-num" data-num="6">6</button>
      <button class="btn btn-op" data-op="+">+</button>

      <button class="btn btn-num" data-num="1">1</button>
      <button class="btn btn-num" data-num="2">2</button>
      <button class="btn btn-num" data-num="3">3</button>
      <button class="btn btn-op btn-equals" data-action="equals">=</button>

      <button class="btn btn-func" data-action="negate">+/-</button>
      <button class="btn btn-num" data-num="0">0</button>
      <button class="btn btn-num" data-action="decimal">.</button>
    </div>

  </div>

  <script src="assets/js/gradient-waves.js"></script>
  <script src="assets/js/script.js"></script>
</body>

</html>
